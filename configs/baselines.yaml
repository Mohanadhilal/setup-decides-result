# The draft-loop versions used from Section 5.3 onwards (baseline_controllers_mv.py).
# FILL IN any value marked <FILL IN> from the source before release: the paper claims
# baseline reproducibility, so no gain may be left undocumented.
pid:
  temperature_loop: {Kp: 0.04, Ki: 0.002, Kd: 0.01, target_C: 73.5}
  draft_loop:       {Kp: <FILL IN>, Ki: <FILL IN>, target_Cc_pct: 12.10}
  note: the draft loop is tuned about five times slower than the temperature loop

mpc:
  horizon_steps: 5
  dt_s: 10.0
  weights: {temperature: <FILL IN>, move_suppression: <FILL IN>}
  internal_model: <FILL IN: the first-order model and its parameters>
  known_limitation: >
    horizon spans 0.09 of one time constant and the internal model is miscalibrated;
    Section 4.4 quantifies this and the paper reports it rather than hiding it

fuzzy:
  type: Mamdani
  inputs: [error_C, error_rate_C_per_step]
  membership_functions: <FILL IN: full specification, required by reviewer 2 comment 5>
  rule_base: <FILL IN: the complete rule table>
  defuzzification: <FILL IN>

setpoint_grid:                      # Table 4
  temperature_C: [71.0, 72.0, 73.0, 73.5, 74.5, 75.5, 76.5, 77.0]
  concentration_pct: [11.80, 12.10, 12.30, 12.50]
